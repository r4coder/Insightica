# Render Blueprint for Multi-Agent Data Analyst.
# Deploy: push this repo to GitHub, then in Render: New -> Blueprint -> select the repo.
# Render reads this file and creates all three resources below in one step.
#
# IMPORTANT - persistence: DuckDB (uploaded datasets + analytical data) lives on the backend
# service's disk. Render's free instance type does not support persistent disks, so on the free
# plan, uploaded datasets and analysis history are lost whenever the backend restarts or redeploys.
# For real persistence, change the backend service's `plan` below from `free` to `starter` (or
# higher) - paid plans support the `disk` block, which then keeps data across restarts. The
# Postgres database itself persists regardless of the backend's plan, since it's a separate
# managed service - only DuckDB's own file storage depends on the backend having a disk.
databases:
  - name: multi-agent-analyst-db
    plan: free
    databaseName: multi_agent_analyst
    user: analyst

services:
  - type: web
    name: multi-agent-analyst-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free  # change to `starter` or higher to enable the `disk` block below for persistence
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multi-agent-analyst-db
          property: connectionString
      - key: DUCKDB_PATH
        value: /data/analytics.duckdb
      - key: DATA_DIR
        value: /data
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: API_KEY_SESSION_TTL_MINUTES
        value: "60"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_AGENT_RETRIES
        value: "3"
      - key: MAX_ROWS_PER_DATASET
        value: "100000"
      - key: ENABLE_LLM_REVIEW
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"  # required because the frontend (static site) and backend are different origins
      - key: CORS_ORIGINS
        # The frontend's public URL. Render's public web/static URLs are deterministic:
        # https://<service name>.onrender.com. If you rename the frontend service below,
        # update this value to match (do not use fromService/host here - that resolves to an
        # internal address for Render's private network, not the public URL browsers use).
        value: https://multi-agent-analyst-frontend.onrender.com
    # Uncomment once the plan above is `starter` or higher:
    # disk:
    #   name: analyst-data
    #   mountPath: /data
    #   sizeGB: 1

  - type: web
    name: multi-agent-analyst-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        # The backend's public URL (same reasoning as CORS_ORIGINS above: this is baked into the
        # client-side JS bundle that runs in the end user's browser, so it must be the real public
        # address, not an internal one). Update if you rename the backend service below.
        value: https://multi-agent-analyst-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
