services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: multi_agent_analyst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d multi_agent_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://analyst:analyst@postgres:5432/multi_agent_analyst
      DUCKDB_PATH: /data/analytics.duckdb
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
